name: Build Native Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0 — creates tag v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            native-artifact: developer-tools-linux
            binary-name: developer-tools
            zip-artifact: developer-tools-zip-linux
            runtime-classifier: linux-x64
          - os: macos-latest
            native-artifact: developer-tools-macos
            binary-name: developer-tools
            zip-artifact: developer-tools-zip-macos
            runtime-classifier: macos-x64
          - os: windows-latest
            native-artifact: developer-tools-windows
            binary-name: developer-tools.exe
            zip-artifact: developer-tools-zip-windows
            runtime-classifier: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Native Image
        run: ./gradlew :app:nativeCompile --no-daemon

      - name: Upload Native Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.native-artifact }}
          path: app/build/native/nativeCompile/${{ matrix.binary-name }}
          if-no-files-found: error

      - name: Build JDK-Bundled ZIP
        run: ./gradlew :app:runtimeZip -PruntimeClassifier=${{ matrix.runtime-classifier }} --no-daemon

      - name: Upload JDK-Bundled ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip-artifact }}
          path: app/build/distributions/developer-tools-*-${{ matrix.runtime-classifier }}.zip
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Tag (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            developer-tools-linux/developer-tools
            developer-tools-macos/developer-tools
            developer-tools-windows/developer-tools.exe
            developer-tools-zip-linux/developer-tools-*-linux-x64.zip
            developer-tools-zip-macos/developer-tools-*-macos-x64.zip
            developer-tools-zip-windows/developer-tools-*-windows-x64.zip
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
